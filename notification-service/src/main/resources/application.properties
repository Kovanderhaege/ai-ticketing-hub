server.port=8082

app.security.ticket-service-url=${TICKET_SERVICE_URL:http://localhost:8083}
app.security.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

spring.application.name=notification-service

spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5433/notificationdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.kova.aiticketinghub.ticketing.contracts.event.TicketAnalyzedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
