server.port=8083
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=51MB

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=TICKETING_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.security.bootstrap-admin-email=${APP_ADMIN_EMAIL:}
app.security.bootstrap-admin-password=${APP_ADMIN_PASSWORD:}

# The same AI_INTERNAL_TOKEN (minimum 32 characters) is required by both services.
app.ai.internal-token=${AI_INTERNAL_TOKEN:}
app.ai.analysis-url=${ANALYSIS_SERVICE_URL:http://localhost:8081}
app.ai.encryption-key=${AI_SETTINGS_ENCRYPTION_KEY:}
app.ai.encryption-key-file=${AI_SETTINGS_KEY_FILE:./data/ai-settings.key}
app.ai.enabled=${LLM_ENABLED:true}
app.ai.provider=${LLM_PROVIDER:OLLAMA}
app.ai.model=${LLM_MODEL:}
app.ai.base-url=${LLM_BASE_URL:}
app.ai.api-key=${LLM_API_KEY:}
app.ai.output-format=${LLM_OUTPUT_FORMAT:SCHEMA}
app.ai.timeout=${LLM_TIMEOUT:30s}
app.ai.connect-timeout=${LLM_CONNECT_TIMEOUT:5s}
app.ai.max-tokens=${LLM_MAX_TOKENS:4096}
app.ai.max-attempts=${LLM_MAX_ATTEMPTS:2}

spring.application.name=ticket-service

spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=ticket-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.kova.aiticketinghub.ticketing.contracts.event.TicketAnalyzedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
