name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_USERNAME: ci
      DB_PASSWORD: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Start PostgreSQL and Kafka
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Wait for infrastructure
        shell: bash
        run: |
          set -euo pipefail
          wait_for() {
            for attempt in {1..60}; do
              if "$@"; then
                return 0
              fi
              sleep 2
            done
            echo "Service failed to become ready: $*" >&2
            return 1
          }
          wait_for docker compose -f infra/docker-compose.yml exec -T ticket-db pg_isready -U "$DB_USERNAME" -d ticketdb
          wait_for docker compose -f infra/docker-compose.yml exec -T notification-db pg_isready -U "$DB_USERNAME" -d notificationdb
          wait_for docker compose -f infra/docker-compose.yml exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list

      - name: Build and install shared contracts
        run: bash ticket-service/mvnw --batch-mode --no-transfer-progress -f ticketing-contracts/pom.xml clean install

      - name: Build and test services
        shell: bash
        run: |
          set -euo pipefail
          for service in ticket-service analysis-service notification-service; do
            bash "$service/mvnw" --batch-mode --no-transfer-progress -f "$service/pom.xml" clean verify
          done

      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
