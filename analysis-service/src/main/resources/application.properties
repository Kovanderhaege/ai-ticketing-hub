server.port=8081

spring.application.name=analysis-service

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=analysis-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.kova.aiticketinghub.ticketing.contracts.event.TicketCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Configuration per installation. Credentials never pass through the browser or Kafka.
analysis.provider=${LLM_PROVIDER:OLLAMA}
analysis.model=${LLM_MODEL:}
analysis.base-url=${LLM_BASE_URL:}
analysis.api-key=${LLM_API_KEY:}
analysis.output-format=${LLM_OUTPUT_FORMAT:SCHEMA}
analysis.timeout=${LLM_TIMEOUT:30s}
analysis.connect-timeout=${LLM_CONNECT_TIMEOUT:5s}
analysis.max-tokens=${LLM_MAX_TOKENS:4096}
analysis.max-attempts=${LLM_MAX_ATTEMPTS:2}
analysis.context-file=${LLM_CONTEXT_FILE:}
